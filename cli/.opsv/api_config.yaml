  # ==========================================
  # RH_CLI (rhcli) — RunningHub via RH_CLI subprocess
  # Generic endpoint runner: rh --json model run -e <endpoint>
  # Requires: Python ≥3.10 + RH_CLI installed (`rh` on PATH, or set rh.binary / RH_CLI_BINARY)
  # Endpoint catalog & selection guide: docs/runninghub-capability-map.md
  # Live check: rh model info <endpoint_id>
  # ==========================================

  # Text-to-image (default: 全能图片PRO)
  rhcli.t2i:
    provider: rhcli
    type: imagen
    required_env: [RUNNINGHUB_API_KEY]
    fallback_env: [RH_API_KEY]
    rh:
      mode: model
      endpoint_id: "rhart-image-n-pro/text-to-image"
      required_capabilities: [json-check, model-run]
    inputs:
      prompt:
        source: prompt
        target: prompt
    defaults:
      resolution: "2k"        # 1k / 2k / 4k
    # == payload_example ==
    payload_example:
      prompt: ""
      aspectRatio: "16:9"
      resolution: "2k"

  # Image-to-image / image editing (default: 全能图片PRO edit)
  rhcli.i2i:
    provider: rhcli
    type: imagen
    required_env: [RUNNINGHUB_API_KEY]
    fallback_env: [RH_API_KEY]
    rh:
      mode: model
      endpoint_id: "rhart-image-n-pro/edit"
      required_capabilities: [json-check, model-run]
      media_bindings:
        imageUrls: { kind: image, target: images, cardinality: { max: 5 } }
    supports_reference_images: true
    max_reference_images: 5
    inputs:
      prompt:
        source: prompt
        target: prompt
      image:
        source: refs[image]
        target: imageUrls
    defaults:
      resolution: "2k"
    # == payload_example ==
    payload_example:
      prompt: ""
      imageUrls: []
      aspectRatio: "empty"    # empty = follow source image
      resolution: "2k"

  # Text-to-video (default: 全能视频V3.1 Fast)
  rhcli.t2v:
    provider: rhcli
    type: video
    required_env: [RUNNINGHUB_API_KEY]
    fallback_env: [RH_API_KEY]
    rh:
      mode: model
      endpoint_id: "rhart-video-v3.1-fast/text-to-video"
      required_capabilities: [json-check, model-run]
    defaults:
      resolution: "720p"      # 720p / 1080p / 4k
    max_poll_duration: 3600000   # 60min subprocess kill switch
    # == payload_example ==
    payload_example:
      prompt: ""
      aspectRatio: "16:9"
      duration: 8
      resolution: "720p"

  # Image-to-video (first frame → video)
  rhcli.i2v:
    provider: rhcli
    type: video
    required_env: [RUNNINGHUB_API_KEY]
    fallback_env: [RH_API_KEY]
    rh:
      mode: model
      endpoint_id: "rhart-video-v3.1-fast/image-to-video"
