      endpoint_id: "kling-v3.0-pro/motion-control"
      required_capabilities: [json-check, model-run]
      media_bindings:
        imageUrl: { kind: image, target: images, cardinality: { max: 1 } }
        videoUrl: { kind: video, target: video, cardinality: { max: 1 } }
    supports_reference_images: true
    max_reference_images: 1
    supports_reference_videos: true
    max_reference_videos: 1
    inputs:
      prompt:
        source: prompt
        target: prompt
      image:
        source: refs[image]
        target: imageUrl
      video:
        source: refs[video]
        target: videoUrl
    defaults:
      characterOrientation: "video"   # image / video
      keepOriginalSound: true
    max_poll_duration: 3600000
    # == payload_example ==
    payload_example:
      prompt: ""
      imageUrl: ""
      videoUrl: ""
      characterOrientation: "video"
      keepOriginalSound: true

