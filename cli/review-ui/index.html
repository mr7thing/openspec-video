<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OpsV Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <style>
    /* ================================================================
       Design Tokens
       ================================================================ */
    :root, [data-theme="dark"] {
      --bg: #1a1a1e;
      --surface: #212126;
      --surface-alt: #27272c;
      --card: #2a2a30;
      --card-hover: #323238;
      --border: rgba(255,255,255,0.06);
      --text: #e4e4e7;
      --text-dim: #a1a1aa;
      --text-muted: #71717a;
      --accent: #6366f1;
      --accent-bg: rgba(99,102,241,0.1);
      --green: #22c55e;
      --green-bg: rgba(34,197,94,0.1);
      --amber: #f59e0b;
      --amber-bg: rgba(245,158,11,0.1);
      --red: #ef4444;
      --overlay: rgba(0,0,0,0.6);

      --sidebar-w: 240px;
      --topbar-h: 44px;
      --actionbar-h: 52px;
      --img-size: 200px;
    }
    [data-theme="light"] {
      --bg: #ffffff;
      --surface: #fafafa;
      --surface-alt: #f4f4f5;
      --card: #f4f4f5;
      --card-hover: #e9e9eb;
      --border: rgba(0,0,0,0.06);
      --text: #18181b;
      --text-dim: #52525b;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
      --accent-bg: rgba(99,102,241,0.08);
      --green: #16a34a;
      --green-bg: rgba(22,163,74,0.08);
      --amber: #d97706;
      --amber-bg: rgba(217,119,6,0.08);
      --red: #dc2626;
      --overlay: rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 14px; line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* ================================================================
       Top Bar
       ================================================================ */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 12px; gap: 8px;
      z-index: 100;
    }
    .topbar .menu-btn {
      width: 32px; height: 32px; flex-shrink: 0;
      border: none; border-radius: 6px;
      background: transparent;
      color: var(--text-dim); font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .topbar .menu-btn:hover { background: var(--card); }
    .topbar .top-title {
      flex: 1; font-size: 13px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .topbar .top-progress {
      font-size: 12px; color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .topbar .theme-btn {
      width: 32px; height: 32px; flex-shrink: 0;
      border: none; border-radius: 6px;
      background: transparent;
      color: var(--text-dim); font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .topbar .theme-btn:hover { background: var(--card); }

    /* ================================================================
       Sidebar
       ================================================================ */
    .sidebar-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: var(--overlay);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      z-index: 301;
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-header {
      flex-shrink: 0;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .sidebar-header .s-title {
      flex: 1; font-size: 14px; font-weight: 600;
    }
    .sidebar-header .s-close {
      width: 28px; height: 28px;
      border: none; border-radius: 6px;
      background: transparent;
      color: var(--text-dim); font-size: 16px;
      cursor: pointer;
      display: none; align-items: center; justify-content: center;
    }
    .sidebar-header .s-close:hover { background: var(--card); }

    .sidebar-body {
      flex: 1; overflow-y: auto;
      padding: 8px 0;
    }
    .sidebar-body::-webkit-scrollbar { width: 4px; }
    .sidebar-body::-webkit-scrollbar-thumb { background: var(--card); border-radius: 2px; }

    .sidebar .sec-title {
      padding: 8px 16px 4px;
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    .cat-item, .doc-item {
      padding: 7px 16px;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
      transition: all 0.1s;
    }
    .cat-item:hover, .doc-item:hover { background: var(--card); color: var(--text); }
    .cat-item.active, .doc-item.active {
      background: var(--accent-bg);
      color: var(--accent);
    }
    .cat-item .cat-count {
      margin-left: auto;
      font-size: 11px; color: var(--text-muted);
      background: var(--card); padding: 0 6px; border-radius: 4px;
    }
    .cat-item.active .cat-count { background: var(--accent-bg); color: var(--accent); }
    .doc-item .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-item .doc-badge {
      font-size: 10px; width: 18px; height: 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .doc-item .doc-badge.approved { background: var(--green-bg); color: var(--green); }
    .doc-item .doc-badge.feedback { background: var(--amber-bg); color: var(--amber); }

    /* Desktop: sidebar always visible */
    @media (min-width: 768px) {
      .topbar .menu-btn { display: none; }
      .sidebar-overlay { display: none !important; }
      .sidebar { transform: translateX(0); }
      .sidebar-header .s-close { display: none !important; }
      .topbar { padding-left: calc(var(--sidebar-w) + 12px); }
    }

    /* Mobile: sidebar close button visible */
    @media (max-width: 767px) {
      .sidebar-header .s-close { display: flex; }
    }

    /* ================================================================
       Main Content
       ================================================================ */
    .main-area {
      position: fixed;
      top: var(--topbar-h); left: 0; right: 0; bottom: var(--actionbar-h);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    @media (min-width: 768px) {
      .main-area { left: var(--sidebar-w); }
    }

    /* Document strip (mobile) */
    .doc-strip {
      flex-shrink: 0;
      padding: 10px 16px 8px;
      display: flex; align-items: flex-start; gap: 10px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      min-height: 40px;
    }
    .doc-strip:active { background: var(--surface-alt); }
    .doc-strip .ds-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .doc-strip .ds-info { flex: 1; min-width: 0; }
    .doc-strip .ds-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-strip .ds-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; margin-top: 2px; }
    .doc-strip .ds-meta .tag { padding: 0 6px; border-radius: 4px; font-weight: 500; font-size: 10px; }
    .doc-strip .ds-meta .tag.character { background: var(--green-bg); color: var(--green); }
    .doc-strip .ds-meta .tag.scene { background: var(--accent-bg); color: var(--accent); }
    .doc-strip .ds-meta .tag.prop { background: var(--amber-bg); color: var(--amber); }
    .doc-strip .ds-preview {
      font-size: 12px; color: var(--text-dim);
      margin-top: 4px; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; max-height: 36px;
    }
    .doc-strip .ds-arrow { font-size: 11px; color: var(--text-muted); flex-shrink: 0; margin-top: 2px; }

    @media (min-width: 768px) {
      .doc-strip { display: none; }
    }

    /* Asset carousel (vertical swipe) */
    .asset-wrap {
      flex: 1; overflow: hidden; position: relative;
      background: var(--bg);
    }
    .asset-carousel {
      height: 100%; width: 100%;
      overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      display: flex;
    }
    .asset-carousel::-webkit-scrollbar { display: none; }
    .asset-slide {
      flex: 0 0 100%; height: 100%;
      scroll-snap-align: start;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
    }
    .asset-slide img {
      max-width: 100%; max-height: 100%;
      object-fit: contain; display: block;
    }
    .asset-slide .empty-msg {
      color: var(--text-muted); font-size: 13px;
      text-align: center; padding: 20px;
    }

    /* Asset info bar */
    .asset-info {
      flex-shrink: 0;
      padding: 6px 16px;
      display: flex; align-items: center; gap: 8px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      min-height: 30px;
    }
    .asset-info .ai-provider {
      flex: 1; font-size: 11px; color: var(--text-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .asset-info .ai-badge {
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 10px; flex-shrink: 0;
    }
    .asset-info .ai-badge.done { background: var(--green-bg); color: var(--green); }
    .asset-info .ai-badge.feedback { background: var(--amber-bg); color: var(--amber); }
    .asset-info .ai-badge.pending { background: var(--card); color: var(--text-muted); }

    /* Thumbnail strip */
    .thumb-strip {
      flex-shrink: 0;
      padding: 6px 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      overflow-x: auto; overflow-y: hidden;
      display: flex; gap: 5px;
      -webkit-overflow-scrolling: touch;
    }
    .thumb-strip::-webkit-scrollbar { display: none; }

    .thumb {
      flex: 0 0 40px; width: 40px; height: 40px;
      border-radius: 4px; overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer; position: relative;
      background: var(--card);
      transition: border-color 0.15s;
    }
    .thumb.cur { border-color: var(--accent); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb .tb {
      position: absolute; top: -2px; right: -2px;
      width: 14px; height: 14px; border-radius: 50%;
      font-size: 7px; display: none; align-items: center; justify-content: center;
      font-weight: 700;
    }
    .thumb.done .tb { display: flex; background: var(--green); color: #fff; }
    .thumb.feedback .tb { display: flex; background: var(--amber); color: #000; }

    /* ================================================================
       Action Bar
       ================================================================ */
    .actionbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--actionbar-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px;
      padding: 0 12px;
      padding-bottom: env(safe-area-inset-bottom, 0);
      z-index: 100;
    }
    @media (min-width: 768px) {
      .actionbar { left: var(--sidebar-w); }
    }

    .act-btn {
      flex: 1; height: 36px;
      border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.12s;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .act-btn:active { transform: scale(0.97); }
    .act-btn:disabled { opacity: 0.3; cursor: default; transform: none; }
    .act-btn.approve { background: var(--green); color: #fff; }
    .act-btn.approve:hover:not(:disabled) { filter: brightness(1.08); }
    .act-btn.feedback { background: var(--amber); color: #000; }
    .act-btn.feedback:hover:not(:disabled) { filter: brightness(1.08); }
    .act-btn.revise { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .act-btn.revise:hover:not(:disabled) { background: var(--card-hover); }

    /* ================================================================
       Doc Panel (bottom slide-up)
       ================================================================ */

    .doc-panel {
      position: fixed; bottom: 0; left: 0; right: 0; max-height: 85vh;
      background: var(--surface);
      border-radius: 12px 12px 0 0;
      z-index: 501;
      display: flex; flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }
    .doc-panel.open { transform: translateY(0); pointer-events: auto; }
    .doc-panel:not(.open) { pointer-events: none; }

    .dp-header {
      flex-shrink: 0;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .dp-header .handle {
      width: 32px; height: 4px; border-radius: 2px;
      background: var(--card); margin: 0 auto 10px;
    }
    .dp-title-row {
      display: flex; align-items: center; gap: 8px;
    }
    .dp-title-row .dp-title { flex: 1; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dp-title-row .dp-close {
      width: 28px; height: 28px; flex-shrink: 0;
      border: none; border-radius: 6px;
      background: transparent; color: var(--text-dim); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .dp-title-row .dp-close:hover { background: var(--card); }

    .dp-tags {
      display: flex; gap: 4px; margin-top: 6px;
    }
    .dp-tags .t {
      font-size: 10px; font-weight: 600;
      padding: 2px 8px; border-radius: 4px;
    }
    .dp-tags .t.character { background: var(--green-bg); color: var(--green); }
    .dp-tags .t.scene { background: var(--accent-bg); color: var(--accent); }
    .dp-tags .t.prop { background: var(--amber-bg); color: var(--amber); }
    .dp-tags .t.approved { background: var(--green-bg); color: var(--green); }
    .dp-tags .t.drafting { background: var(--card); color: var(--text-muted); }

    .dp-body {
      flex: 1; min-height: 0; overflow-y: auto; padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .dp-body .fm-meta {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;
    }
    .dp-body .fm-meta span {
      font-size: 12px; color: var(--text-dim);
      background: var(--card); padding: 2px 8px; border-radius: 4px;
    }

    /* Markdown body */
    .md h1 { font-size: 20px; margin: 24px 0 12px; font-weight: 700; }
    .md h2 { font-size: 17px; margin: 20px 0 10px; font-weight: 600; }
    .md h3 { font-size: 15px; margin: 16px 0 8px; font-weight: 600; }
    .md p { margin-bottom: 8px; color: var(--text-dim); line-height: 1.7; }
    .md strong { color: var(--text); font-weight: 600; }
    .md pre {
      background: var(--card); border-radius: 6px;
      padding: 12px; font-size: 13px;
      overflow-x: auto; margin: 8px 0;
    }
    .md code {
      background: var(--card); padding: 1px 5px;
      border-radius: 4px; font-size: 13px;
      color: var(--accent);
    }
    .md pre code { background: none; padding: 0; color: var(--text-dim); }
    .md blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px; color: var(--text-muted);
      font-style: italic; margin: 8px 0;
    }
    .md ul, .md ol { margin: 6px 0 8px 18px; color: var(--text-dim); }
    .md li { margin-bottom: 3px; }
    .md img { border-radius: 6px; margin: 4px; cursor: pointer; max-width: var(--img-size, 200px); }
    .md img:hover { filter: brightness(1.1); }
    .img-size-bar { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
    .img-size-bar .is-label { font-size: 11px; color: var(--text-muted); }
    .img-size-bar .is-btn {
      width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--card); color: var(--text-dim); font-size: 11px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .img-size-bar .is-btn.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
    .md table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
    .md th, .md td { padding: 6px 8px; border: 1px solid var(--border); }
    .md th { background: var(--card); font-weight: 600; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

    .dp-comment {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; gap: 8px;
      align-items: flex-end;
    }
    .dp-comment textarea {
      flex: 1; background: var(--card);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 7px 10px;
      font-size: 13px; font-family: inherit;
      resize: none; min-height: 32px; max-height: 72px;
      outline: none; line-height: 1.4;
    }
    .dp-comment textarea:focus { border-color: var(--accent); }
    .dp-comment .cmt-btn {
      width: 32px; height: 32px; flex-shrink: 0;
      border: none; border-radius: 6px;
      background: var(--accent); color: #fff;
      font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .dp-comment .cmt-btn:disabled { opacity: 0.4; cursor: default; }

    /* Desktop doc panel */
    @media (min-width: 768px) {
      .doc-panel {
        position: static; transform: none; border-radius: 0;
        max-height: none; height: 100%;
        border-left: 1px solid var(--border);
        display: flex; flex-direction: column;
      }
      .doc-panel:not(.open) { display: none; }
      .doc-panel.open { transform: none; }
      .dp-header .handle { display: none; }
    }

    /* Desktop split: main area has doc panel on right */
    @media (min-width: 768px) {
      .main-area-inner {
        display: flex; flex: 1; overflow: hidden;
      }
      .main-area-inner .asset-col {
        flex: 1; display: flex; flex-direction: column; overflow: hidden;
      }
      .main-area-inner .doc-col {
        flex: 0 0 360px; overflow: hidden; display: flex; flex-direction: column;
      }
      .main-area-inner .doc-col.collapsed { flex: 0 0 0; }
    }

    /* ================================================================
       Image Preview Overlay
       ================================================================ */
    .img-preview {
      position: fixed; inset: 0; z-index: 600;
      background: var(--overlay);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
    }
    .img-preview.open { display: flex; }
    .img-preview img { max-width: 95%; max-height: 90vh; object-fit: contain; border-radius: 4px; }
    .img-preview .ip-close {
      position: absolute; top: 12px; right: 12px;
      width: 36px; height: 36px;
      border: none; border-radius: 8px;
      background: var(--card); color: var(--text);
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ================================================================
       Modal
       ================================================================ */
    .modal {
      position: fixed; inset: 0; z-index: 700;
      background: var(--overlay);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: var(--surface); border-radius: 10px;
      padding: 20px; width: 100%; max-width: 320px;
    }
    .modal-box .m-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .modal-box .m-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .modal-box textarea {
      width: 100%; background: var(--card);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 8px 10px;
      font-size: 13px; font-family: inherit;
      resize: vertical; min-height: 72px; outline: none;
    }
    .modal-box textarea:focus { border-color: var(--accent); }
    .modal-box .m-actions { display: flex; gap: 8px; margin-top: 12px; }
    .modal-box .m-actions button {
      flex: 1; height: 36px;
      border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .modal-box .m-actions .btn-cancel { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .modal-box .m-actions .btn-ok { background: var(--accent); color: #fff; }

    /* ================================================================
       Toast
       ================================================================ */
    .toast {
      position: fixed; top: 56px; left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 7px 14px; border-radius: 6px;
      font-size: 13px; z-index: 800;
      opacity: 0; transition: all 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { border-color: var(--green); color: var(--green); }
    .toast.err { border-color: var(--red); color: var(--red); }
    .toast.info { border-color: var(--accent); color: var(--accent); }

    /* ================================================================
       Loading / Empty / Error
       ================================================================ */
    .loading-area {
      position: fixed; top: var(--topbar-h); left: 0; right: 0; bottom: var(--actionbar-h);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 40px;
    }
    @media (min-width: 768px) { .loading-area { left: var(--sidebar-w); } }
    .loading-area .pulse {
      width: 70%; height: 14px;
      background: var(--card); border-radius: 4px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .loading-area .pulse:nth-child(2) { width: 50%; animation-delay: 0.15s; }
    .loading-area .pulse:nth-child(3) { width: 60%; animation-delay: 0.3s; }
    @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.6; } }

    .empty-area, .error-area {
      position: fixed; top: var(--topbar-h); left: 0; right: 0; bottom: var(--actionbar-h);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 40px; text-align: center;
      color: var(--text-muted);
    }
    @media (min-width: 768px) { .empty-area, .error-area { left: var(--sidebar-w); } }
    .empty-area .icon, .error-area .icon { font-size: 36px; opacity: 0.4; }
    .error-area .retry {
      margin-top: 10px; padding: 6px 16px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--text);
      font-size: 13px; cursor: pointer;
    }

    /* ================================================================
       Split View (Multi-document comparison)
       ================================================================ */
    .split-btn {
      width: 32px; height: 32px; flex-shrink: 0;
      border: none; border-radius: 6px;
      background: transparent;
      color: var(--text-dim); font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .split-btn:hover { background: var(--card); }
    .split-btn.active { background: var(--accent-bg); color: var(--accent); }

    .split-container {
      display: none; flex: 1; overflow: hidden;
    }
    .split-container.active { display: flex; }
    .split-pane {
      flex: 1; display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden; min-width: 0;
    }
    .split-pane:last-child { border-right: none; }
    .split-pane-header {
      flex-shrink: 0;
      padding: 8px 12px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
      min-height: 36px;
    }
    .split-pane-header .sp-title {
      flex: 1; font-size: 13px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .split-pane-header .sp-tag {
      font-size: 10px; font-weight: 600;
      padding: 2px 6px; border-radius: 4px;
    }
    .split-pane-header .sp-close {
      width: 24px; height: 24px;
      border: none; border-radius: 4px;
      background: transparent;
      color: var(--text-muted); font-size: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .split-pane-header .sp-close:hover { background: var(--card); color: var(--text); }
    .split-pane-body {
      flex: 1; overflow-y: auto; padding: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .split-ref-link {
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
      border-bottom: 1px dashed var(--accent);
      transition: all 0.15s;
    }
    .split-ref-link:hover {
      color: var(--text);
      border-bottom-color: var(--text);
    }
    .split-pane-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 13px;
      flex-direction: column; gap: 8px; padding: 20px;
    }
    .split-pane-empty .hint {
      font-size: 11px; color: var(--text-muted);
      text-align: center; line-height: 1.5;
    }

    /* Review Runtime modes: shared Timeline and Canvas projections */
    .mode-switch { display:flex; gap:4px; margin-left:auto; }
    .mode-btn {
      border:1px solid var(--border); background:var(--surface-alt); color:var(--text-muted);
      border-radius:7px; padding:6px 10px; font-size:12px; cursor:pointer;
    }
    .mode-btn:hover, .mode-btn.active { color:var(--text); border-color:var(--accent); background:var(--card); }
    .review-mode-shell {
      display:none; flex:1; min-height:0; height:100%; grid-template-columns:220px minmax(0,1fr) 280px;
      background:var(--surface); color:var(--text);
    }
    .review-mode-shell.active { display:grid; }
    .review-assets-panel, .review-inspector { min-width:0; overflow:auto; background:var(--surface-alt); }
    .review-assets-panel { border-right:1px solid var(--border); }
    .review-inspector { border-left:1px solid var(--border); padding:12px; }
    .review-panel-title { padding:12px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); border-bottom:1px solid var(--border); }
    .review-asset-list { padding:8px; display:flex; flex-direction:column; gap:6px; }
    .review-asset-item {
      width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center;
      text-align:left; color:var(--text); background:var(--card); border:1px solid var(--border);
      border-radius:8px; padding:8px; cursor:pointer;
    }
    .review-asset-item:hover, .review-asset-item.selected { border-color:var(--accent); }
    .review-asset-copy { min-width:0; }
    .review-asset-name { display:block; font-size:12px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .review-asset-meta { display:block; margin-top:3px; color:var(--text-muted); font-size:10px; }
    .review-add-btn, .review-small-btn {
      border:1px solid var(--border); background:var(--surface-alt); color:var(--text); border-radius:6px;
      padding:4px 7px; font-size:11px; cursor:pointer;
    }
    .review-add-btn:hover, .review-small-btn:hover { border-color:var(--accent); color:var(--accent); }
    .review-workspace { min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
    .review-toolbar {
      min-height:45px; display:flex; align-items:center; gap:8px; padding:8px 12px;
      border-bottom:1px solid var(--border); background:var(--surface-alt);
    }
    .review-toolbar .spacer { flex:1; }
    .review-time { font-variant-numeric:tabular-nums; font-size:12px; color:var(--text-muted); }
    .review-player-host { min-height:0; max-height:34vh; display:flex; justify-content:center; background:#090b10; border-bottom:1px solid var(--border); }
    .review-player-host:empty { display:none; }
    .review-player-host video, .review-player-host audio { width:100%; max-height:34vh; background:#000; }
    .timeline-view, .canvas-view { display:none; flex:1; min-height:0; overflow:hidden; flex-direction:column; }
    .timeline-view.active, .canvas-view.active { display:flex; }
    .timeline-scroll { position:relative; flex:1; min-height:0; overflow:auto; background:var(--surface); }
    .timeline-content { position:relative; min-height:100%; padding-bottom:24px; }
    .timeline-ruler, .timeline-lane-row { display:grid; min-height:48px; }
    .timeline-ruler { min-height:32px; position:sticky; top:0; z-index:7; background:var(--surface-alt); border-bottom:1px solid var(--border); }
    .timeline-label {
      position:sticky; left:0; z-index:6; display:flex; align-items:center; padding:0 10px;
      font-size:11px; font-weight:650; background:var(--surface-alt); border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    }
    .timeline-track { position:relative; min-height:58px; border-bottom:1px solid var(--border); background-image:linear-gradient(90deg, color-mix(in srgb, var(--border) 55%, transparent) 1px, transparent 1px); }
    .timeline-ruler-track { position:relative; min-height:32px; }
    .timeline-tick { position:absolute; top:0; bottom:0; border-left:1px solid var(--border); color:var(--text-muted); font-size:9px; padding-left:3px; }
    .timeline-placement {
      position:absolute; top:9px; height:38px; min-width:18px; border-radius:7px; padding:5px 7px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#fff; font-size:10px;
      border:1px solid rgba(255,255,255,.24); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.18);
    }
    .timeline-placement.playback { background:#3b67d8; }
    .timeline-placement.annotation { background:#8a4fd3; }
    .timeline-placement.context { background:#267f62; }
    .timeline-placement.selected { outline:2px solid #fff; outline-offset:1px; }
    .timeline-placement.stale { background:#8b3942; border-style:dashed; }
    .timeline-playhead { position:absolute; top:0; bottom:0; width:2px; background:#ff4f64; z-index:8; pointer-events:none; }
    .timeline-playhead::before { content:''; position:absolute; top:0; left:-5px; border-left:6px solid transparent; border-right:6px solid transparent; border-top:8px solid #ff4f64; }
    .canvas-viewport { position:relative; flex:1; min-height:0; overflow:hidden; touch-action:none; cursor:grab; background-color:var(--surface); background-image:radial-gradient(var(--border) 1px, transparent 1px); background-size:20px 20px; }
    .canvas-viewport.dragging { cursor:grabbing; }
    .canvas-world { position:absolute; left:0; top:0; width:4000px; height:2600px; transform-origin:0 0; }
    .canvas-edges { position:absolute; inset:0; width:4000px; height:2600px; overflow:visible; pointer-events:none; }
    .canvas-edge { stroke:var(--text-muted); stroke-width:1.5; fill:none; marker-end:url(#canvasArrow); opacity:.65; }
    .canvas-node {
      position:absolute; width:166px; min-height:70px; padding:10px; border-radius:12px;
      background:var(--card); border:1px solid var(--border); box-shadow:0 5px 18px rgba(0,0,0,.14);
      cursor:pointer; user-select:none; touch-action:none;
    }
    .canvas-node:hover, .canvas-node.selected { border-color:var(--accent); box-shadow:0 7px 22px rgba(0,0,0,.2); }
    .canvas-node-title { font-size:12px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .canvas-node-meta { margin-top:5px; color:var(--text-muted); font-size:10px; }
    .canvas-node-flags { display:flex; gap:4px; flex-wrap:wrap; margin-top:7px; }
    .canvas-node-flag { border-radius:9px; padding:2px 5px; background:var(--surface-alt); font-size:9px; }
    .review-inspector-empty { color:var(--text-muted); font-size:12px; line-height:1.6; padding:18px 4px; }
    .review-inspector h3 { margin:0 0 4px; font-size:15px; }
    .review-inspector-section { margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
    .review-inspector-section h4 { margin:0 0 8px; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
    .review-detail-row { display:flex; gap:6px; align-items:center; justify-content:space-between; margin:6px 0; font-size:11px; }
    .review-detail-copy { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    @media (max-width: 900px) {
      .review-mode-shell.active { grid-template-columns:170px minmax(0,1fr); }
      .review-inspector { position:absolute; right:0; top:0; bottom:0; width:min(300px,82vw); z-index:20; box-shadow:-8px 0 25px rgba(0,0,0,.25); }
    }
    @media (max-width: 620px) {
      .mode-btn { padding:5px 7px; font-size:11px; }
      .review-mode-shell.active { grid-template-columns:1fr; }
      .review-assets-panel { display:none; }
      .review-inspector { display:none; }
      .timeline-label { width:88px; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">☰</button>
    <span class="top-title" id="topTitle">OpsV Review</span>
    <span class="top-progress" id="topProgress">-/-</span>
    <div class="mode-switch" aria-label="Review mode">
      <button class="mode-btn active" id="modeReviewBtn" onclick="setReviewMode('review')">审阅</button>
      <button class="mode-btn" id="modeTimelineBtn" onclick="setReviewMode('timeline')">时间轴</button>
      <button class="mode-btn" id="modeCanvasBtn" onclick="setReviewMode('canvas')">画布</button>
    </div>
    <button class="split-btn" id="splitBtn" onclick="toggleSplitView()" title="分屏对比">⊞</button>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="s-title" id="sidebarTitle">OpsV Review</span>
      <button class="s-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="sidebar-body">
      <div class="sec-title">分类</div>
      <div id="catList"></div>
      <div class="sec-title" style="margin-top:8px;">文档</div>
      <div id="docList"></div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-area" id="mainArea">
    <div class="loading-area" id="loadingView">
      <div class="pulse"></div>
      <div class="pulse"></div>
      <div class="pulse"></div>
    </div>

    <div class="empty-area" id="emptyView" style="display:none;">
      <div class="icon">📋</div>
      <p>暂无文档</p>
    </div>

    <div class="error-area" id="errorView" style="display:none;">
      <div class="icon">⚠️</div>
      <p id="errorMsg"></p>
      <button class="retry" onclick="init()">重试</button>
    </div>

    <!-- Actual content (hidden until loaded) -->
    <div id="contentView" style="display:none;flex-direction:column;overflow:hidden;">
      <div class="main-area-inner" id="mainInner">
        <div class="asset-col">
          <!-- Doc strip (mobile) -->
          <div class="doc-strip" id="docStrip" onclick="openDocPanel()">
            <span class="ds-icon">📄</span>
            <div class="ds-info">
              <div class="ds-title" id="dsTitle">-</div>
              <div class="ds-meta"><span class="tag" id="dsTag"></span><span id="dsCount">0个资产</span></div>
              <div class="ds-preview" id="dsPreview"></div>
            </div>
            <span class="ds-arrow">▲</span>
          </div>

          <!-- Asset carousel -->
          <div class="asset-wrap">
            <div class="asset-carousel" id="assetCarousel"></div>
          </div>

          <!-- Asset info -->
          <div class="asset-info" id="assetInfo">
            <span class="ai-provider" id="aiProvider">-</span>
            <span class="ai-badge pending" id="aiBadge">待审阅</span>
          </div>

          <!-- Thumbnails -->
          <div class="thumb-strip" id="thumbStrip"></div>
        </div>
        <!-- Doc panel column (desktop) -->
        <div class="doc-col" id="docCol">
          <div class="doc-panel" id="docPanel">
            <div class="dp-header">
              <div class="handle"></div>
              <div class="dp-title-row">
                <span class="dp-title" id="dpTitle">文档</span>
                <button class="dp-close" id="dpCloseBtn" onclick="closeDocPanel()">✕</button>
              </div>
              <div class="dp-tags" id="dpTags"></div>
              <div class="img-size-bar">
                <span class="is-label">图</span>
                <button class="is-btn" data-size="120" onclick="setImgSize(120)">小</button>
                <button class="is-btn active" data-size="200" onclick="setImgSize(200)">中</button>
                <button class="is-btn" data-size="320" onclick="setImgSize(320)">大</button>
              </div>
            </div>
            <div class="dp-body" id="dpBody"></div>
            <div class="dp-comment">
              <textarea id="cmtInput" placeholder="添加评论…" rows="1"></textarea>
              <button class="cmt-btn" id="cmtBtn" onclick="submitComment()" disabled>↵</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="review-mode-shell" id="reviewModeView">
      <aside class="review-assets-panel">
        <div class="review-panel-title">Assets</div>
        <div class="review-asset-list" id="reviewAssetList"></div>
      </aside>
      <section class="review-workspace">
        <div class="review-toolbar">
          <button class="review-small-btn" id="timelinePlayBtn" onclick="toggleTimelinePlayback()">▶ 播放</button>
          <span class="review-time" id="reviewTimeLabel">00:00.000</span>
          <span class="spacer"></span>
          <button class="review-small-btn" id="canvasFitBtn" onclick="fitCanvas()" style="display:none">适合视图</button>
          <button class="review-small-btn" onclick="reloadReviewProjection()">刷新投影</button>
        </div>
        <div class="review-player-host" id="reviewPlayerHost"></div>
        <div class="timeline-view" id="timelineModeView">
          <div class="timeline-scroll" id="timelineScroll"></div>
        </div>
        <div class="canvas-view" id="canvasModeView">
          <div class="canvas-viewport" id="canvasViewport">
            <div class="canvas-world" id="canvasWorld">
              <svg class="canvas-edges" id="canvasEdges">
                <defs><marker id="canvasArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path></marker></defs>
              </svg>
              <div id="canvasNodes"></div>
            </div>
          </div>
        </div>
      </section>
      <aside class="review-inspector" id="reviewInspector">
        <div class="review-inspector-empty">选择 Asset、Artifact 或 Segment 查看详情，并将其放入 Review Timeline。</div>
      </aside>
    </div>
  </div>

  <!-- Split View Container (multi-document comparison) -->
  <div class="split-container" id="splitContainer">
    <div class="split-pane" id="splitPane1">
      <div class="split-pane-header">
        <span class="sp-title" id="sp1Title">文档 A</span>
        <button class="sp-close" onclick="closeSplitPane(1)">✕</button>
      </div>
      <div class="split-pane-body" id="sp1Body">
        <div class="split-pane-empty">
          <span>📄</span>
          <div class="hint">点击文档列表中的<br>文档名打开到此面板</div>
        </div>
      </div>
    </div>
    <div class="split-pane" id="splitPane2">
      <div class="split-pane-header">
        <span class="sp-title" id="sp2Title">文档 B</span>
        <button class="sp-close" onclick="closeSplitPane(2)">✕</button>
      </div>
      <div class="split-pane-body" id="sp2Body">
        <div class="split-pane-empty">
          <span>📄</span>
          <div class="hint">点击 @id 引用链接<br>可在此打开依赖文档</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Bar -->
  <div class="actionbar" id="actionBar">
    <button class="act-btn approve" id="btnApprove" onclick="doAction('approve')">✓ 通过</button>
    <button class="act-btn feedback" id="btnFeedback" onclick="doAction('feedback')">✎ 反馈</button>
    <button class="act-btn revise" id="btnRevise" onclick="doAction('revise')">✏ 修订</button>
  </div>

  <!-- Image Preview -->
  <div class="img-preview" id="imgPreview" onclick="closePreview(event)">
    <button class="ip-close">✕</button>
    <img id="previewImg" src="" alt="">
  </div>

  <!-- Modal -->
  <div class="modal" id="reviewModal">
    <div class="modal-box">
      <div class="m-title" id="modalTitle">操作</div>
      <div class="m-sub" id="modalSub"></div>
      <textarea id="modalNote" placeholder="输入备注（可选）…"></textarea>
      <div class="m-actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-ok" id="modalOk" onclick="confirmModal()">确认</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ================================================================
    // State
    // ================================================================
    const API = '';
    let allDocs = [];
    let filteredDocs = [];
    let docContents = {};
    let reviewState = {};
    let removedApproved = new Set(); // tracks removed approved reference image URLs
    let curDocIdx = 0;
    let curAssetIdx = 0;
    let pendingAction = null;
    let pendingRemove = null;
    let currentCat = '';
    let splitMode = false;
    let splitPanes = { 1: null, 2: null }; // docId in each pane


    // ================================================================
    // Review Runtime: shared Timeline / Canvas session
    // ================================================================
    const REVIEW_SESSION_STORAGE_KEY = 'opsv-review-session-v1';
    let reviewMode = 'review';
    let reviewWorkspace = null;
    let reviewFocusCache = {};
    let reviewPlaybackTimer = null;
    let reviewPlaybackMedia = null;
    let canvasDrag = null;
    let canvasNodeDrag = null;
    let canvasInteractionsBound = false;
    let reviewSession = loadReviewSession();

    function defaultReviewSession() {
      return {
        version: 1,
        playhead: 0,
        primaryPlayback: null,
        selection: null,
        placements: [],
        canvas: { panX: 40, panY: 40, scale: 0.9, nodePositions: {} }
      };
    }

    function loadReviewSession() {
      const fallback = defaultReviewSession();
      try {
        const raw = localStorage.getItem(REVIEW_SESSION_STORAGE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return {
          ...fallback,
          ...parsed,
          placements: Array.isArray(parsed.placements) ? parsed.placements : [],
          canvas: { ...fallback.canvas, ...(parsed.canvas || {}), nodePositions: { ...(parsed.canvas && parsed.canvas.nodePositions || {}) } }
        };
      } catch (_) { return fallback; }
    }

    function saveReviewSession() {
      try { localStorage.setItem(REVIEW_SESSION_STORAGE_KEY, JSON.stringify(reviewSession)); } catch (_) {}
    }

    function setReviewMode(mode) {
      reviewMode = mode;
      ['review', 'timeline', 'canvas'].forEach(name => {
        const btn = document.getElementById(`mode${name[0].toUpperCase()}${name.slice(1)}Btn`);
        if (btn) btn.classList.toggle('active', name === mode);
      });
      const content = document.getElementById('contentView');
      const split = document.getElementById('splitContainer');
      const actions = document.getElementById('actionBar');
      const modes = document.getElementById('reviewModeView');
      const shell = document.getElementById('mainArea');
      if (mode === 'review') {
        modes.classList.remove('active');
        if (splitMode) split.classList.add('active');
        else content.style.display = 'flex';
        actions.style.display = '';
        document.getElementById('splitBtn').style.display = '';
        document.getElementById('topTitle').dataset.modeTitle = '';
      } else {
        if (splitMode) toggleSplitView();
        content.style.display = 'none';
        split.classList.remove('active');
        actions.style.display = 'none';
        document.getElementById('splitBtn').style.display = 'none';
        modes.classList.add('active');
        document.getElementById('timelineModeView').classList.toggle('active', mode === 'timeline');
        document.getElementById('canvasModeView').classList.toggle('active', mode === 'canvas');
        document.getElementById('canvasFitBtn').style.display = mode === 'canvas' ? '' : 'none';
        document.getElementById('topTitle').dataset.modeTitle = mode === 'timeline' ? 'Review Timeline' : 'Review Canvas';
        renderReviewMode();
      }
      if (reviewWorkspace) renderReviewMode();
    }

    async function loadReviewWorkspace() {
      try {
        const response = await fetch(`${API}/api/review/workspace`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        reviewWorkspace = await response.json();
        renderReviewAssetList();
        renderCanvas();
        if (reviewSession.selection && !reviewFocusCache[reviewSession.selection.assetId]) {
          await selectReviewAsset(reviewSession.selection.assetId, false);
        } else {
          renderReviewMode();
        }
      } catch (error) {
        console.warn('Review projection unavailable', error);
        reviewWorkspace = null;
      }
    }

    async function reloadReviewProjection() {
      reviewFocusCache = {};
      await loadReviewWorkspace();
      showToast('Review 投影已刷新', 'success');
    }

    function renderReviewMode() {
      renderReviewAssetList();
      if (reviewMode === 'timeline') renderTimeline();
      if (reviewMode === 'canvas') renderCanvas();
      const selection = reviewSession.selection;
      if (selection && reviewFocusCache[selection.assetId]) renderInspector(reviewFocusCache[selection.assetId]);
      updateReviewPlayer();
    }

    function renderReviewAssetList() {
      const list = document.getElementById('reviewAssetList');
      if (!list) return;
      if (!reviewWorkspace || !reviewWorkspace.assets.length) {
        list.innerHTML = '<div class="review-inspector-empty">暂无可用 Asset</div>';
        return;
      }
      list.innerHTML = reviewWorkspace.assets.map(asset => {
        const selected = reviewSession.selection && reviewSession.selection.assetId === asset.assetId;
        const kinds = asset.previewKinds.length ? asset.previewKinds.join(', ') : 'document';
        return `<div class="review-asset-item${selected ? ' selected' : ''}" data-review-asset="${escapeHtml(asset.assetId)}">
          <div class="review-asset-copy"><span class="review-asset-name">${escapeHtml(asset.assetId)}</span>
          <span class="review-asset-meta">${escapeHtml(asset.category)} · ${escapeHtml(asset.lifecycleState)} · ${escapeHtml(kinds)}</span></div>
          <button class="review-add-btn" data-review-add="${escapeHtml(asset.assetId)}" title="将 Asset 放入时间轴">+</button>
        </div>`;
      }).join('');
      list.querySelectorAll('[data-review-asset]').forEach(el => el.addEventListener('click', () => selectReviewAsset(el.dataset.reviewAsset)));
      list.querySelectorAll('[data-review-add]').forEach(el => el.addEventListener('click', event => {
        event.stopPropagation();
        addReviewPlacement(el.dataset.reviewAdd);
      }));
    }

    async function selectReviewAsset(assetId, syncDocument = true) {
      if (!assetId) return;
      reviewSession.selection = { kind: 'asset', assetId, targetId: assetId };
      saveReviewSession();
      if (syncDocument) syncLegacyDocumentSelection(assetId);
      renderReviewAssetList();
      const focus = await getReviewFocus(assetId);
      if (focus) {
        renderInspector(focus);
        renderTimeline();
        renderCanvas();
      }
    }

    async function getReviewFocus(assetId, probe = false) {
      if (reviewFocusCache[assetId] && !probe) return reviewFocusCache[assetId];
      try {
        const response = await fetch(`${API}/api/review/assets/${encodeURIComponent(assetId)}${probe ? '?probe=1' : ''}`);
        if (!response.ok) return null;
        const focus = await response.json();
        reviewFocusCache[assetId] = focus;
        return focus;
      } catch (_) { return null; }
    }

    function syncLegacyDocumentSelection(assetId) {
      const idx = filteredDocs.findIndex(doc => doc.docId === assetId);
      if (idx < 0) return;
      curDocIdx = idx;
      document.querySelectorAll('#docList .doc-item').forEach(el => el.classList.toggle('active', parseInt(el.dataset.idx) === idx));
      updateProgress();
      loadDoc(idx);
    }

    function renderInspector(focus) {
      const panel = document.getElementById('reviewInspector');
      if (!panel || !focus) return;
      const segmentHtml = (focus.timeline?.segments || []).map(segment => `<div class="review-detail-row">
        <span class="review-detail-copy">${escapeHtml(segment.id)} · ${formatReviewTime(segment.start)}–${formatReviewTime(segment.end)}</span>
        <button class="review-small-btn" data-jump-segment="${escapeHtml(segment.id)}">＋</button>
      </div>`).join('') || '<div class="review-inspector-empty">没有 Canonical Segment</div>';
      const artifactHtml = (focus.artifacts || []).map(artifact => `<div class="review-detail-row">
        <span class="review-detail-copy">${escapeHtml(artifact.type)} · ${escapeHtml(artifact.preview.kind)}${artifact.preview.duration ? ` · ${formatReviewTime(artifact.preview.duration)}` : ''}</span>
        <span><button class="review-small-btn" data-primary-artifact="${escapeHtml(artifact.artifactId)}">▶</button>
        <button class="review-small-btn" data-add-artifact="${escapeHtml(artifact.artifactId)}">＋</button></span>
      </div>`).join('') || '<div class="review-inspector-empty">没有 Artifact</div>';
      const refsHtml = (focus.references || []).map(ref => `<div class="review-detail-row"><span class="review-detail-copy">@${escapeHtml(ref.id)}</span><span>${ref.relation === 'production-dependency' ? '依赖' : '上下文'}</span></div>`).join('') || '<div class="review-inspector-empty">没有 Reference</div>';
      panel.innerHTML = `<h3>${escapeHtml(focus.asset.assetId)}</h3>
        <div class="review-detail-row"><span>category</span><strong>${escapeHtml(focus.asset.category)}</strong></div>
        <div class="review-detail-row"><span>state</span><strong>${escapeHtml(focus.asset.lifecycleState)}</strong></div>
        <div class="review-inspector-section"><h4>Asset</h4><button class="review-small-btn" data-add-asset="${escapeHtml(focus.asset.assetId)}">＋ 放入时间轴</button></div>
        <div class="review-inspector-section"><h4>Segments</h4>${segmentHtml}</div>
        <div class="review-inspector-section"><h4>Artifacts</h4>${artifactHtml}</div>
        <div class="review-inspector-section"><h4>References</h4>${refsHtml}</div>`;
      panel.querySelector('[data-add-asset]')?.addEventListener('click', () => addReviewPlacement(focus.asset.assetId));
      panel.querySelectorAll('[data-jump-segment]').forEach(el => el.addEventListener('click', () => addReviewPlacement(focus.asset.assetId, 'segment', el.dataset.jumpSegment)));
      panel.querySelectorAll('[data-add-artifact]').forEach(el => el.addEventListener('click', () => addReviewPlacement(focus.asset.assetId, 'artifact', el.dataset.addArtifact)));
      panel.querySelectorAll('[data-primary-artifact]').forEach(el => el.addEventListener('click', () => setPrimaryPlayback(focus.asset.assetId, el.dataset.primaryArtifact)));
    }

    function addReviewPlacement(assetId, targetKind = 'asset', targetId = null) {
      const focus = reviewFocusCache[assetId];
      if (!focus) { selectReviewAsset(assetId); return; }
      let artifact = null;
      let segment = null;
      if (targetKind === 'artifact') artifact = focus.artifacts.find(item => item.artifactId === targetId) || null;
      if (targetKind === 'segment') segment = (focus.timeline?.segments || []).find(item => item.id === targetId) || null;
      if (targetKind === 'asset') {
        artifact = focus.artifacts.find(item => item.preview.kind === 'video' || item.preview.kind === 'audio') || null;
        if (artifact) targetKind = 'artifact';
        else segment = focus.timeline?.segments?.[0] || null;
        if (segment) targetKind = 'segment';
      }
      const lane = artifact ? 'playback' : chooseReviewLane(focus.asset.category);
      const start = segment ? segment.start : reviewSession.playhead;
      const duration = artifact?.preview.duration;
      const end = segment ? segment.end : (duration ? start + duration : undefined);
      const placement = {
        id: `placement-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
        assetId,
        targetKind,
        targetId: artifact?.artifactId || segment?.id || assetId,
        revisionId: artifact?.revisionId,
        lane,
        start,
        end,
        label: artifact ? `${assetId} · ${artifact.type}` : segment ? `${assetId} · ${segment.id}` : assetId
      };
      reviewSession.placements.push(placement);
      if (artifact && !reviewSession.primaryPlayback) {
        reviewSession.primaryPlayback = { assetId, artifactId: artifact.artifactId, revisionId: artifact.revisionId };
        updateReviewPlayer();
      }
      saveReviewSession();
      renderTimeline();
      showToast(`已加入 ${lane === 'playback' ? 'Playback' : lane === 'annotation' ? 'Annotation' : 'Context'} Lane`, 'success');
    }

    function chooseReviewLane(category) {
      const value = String(category || '').toLowerCase();
      if (/(ref|reference|sketch|design|character|scene|参考|草图|角色|场景)/u.test(value)) return 'context';
      return 'annotation';
    }

    function setPrimaryPlayback(assetId, artifactId) {
      const focus = reviewFocusCache[assetId];
      const artifact = focus?.artifacts.find(item => item.artifactId === artifactId);
      if (!artifact || !artifact.preview.previewUrl) {
        showToast('该 Artifact 暂不可播放', 'error');
        return;
      }
      reviewSession.primaryPlayback = { assetId, artifactId, revisionId: artifact.revisionId };
      saveReviewSession();
      updateReviewPlayer();
    }

    function updateReviewPlayer() {
      const host = document.getElementById('reviewPlayerHost');
      if (!host || reviewMode === 'review') return;
      const primary = reviewSession.primaryPlayback;
      const focus = primary && reviewFocusCache[primary.assetId];
      const artifact = focus?.artifacts.find(item => item.artifactId === primary.artifactId);
      const url = artifact?.preview?.previewUrl;
      if (!url) {
        host.innerHTML = '';
        reviewPlaybackMedia = null;
        return;
      }
      if (reviewPlaybackMedia && reviewPlaybackMedia.dataset.previewUrl === url) return;
      host.innerHTML = '';
      const media = document.createElement(artifact.preview.kind === 'audio' ? 'audio' : 'video');
      media.controls = true;
      media.playsInline = true;
      media.dataset.previewUrl = url;
      media.src = url;
      media.addEventListener('timeupdate', () => {
        const placement = reviewSession.placements.find(item => item.targetKind === 'artifact' && item.targetId === primary.artifactId);
        reviewSession.playhead = (placement?.start || 0) + media.currentTime;
        updateTimelinePlayhead();
      });
      media.addEventListener('play', () => { document.getElementById('timelinePlayBtn').textContent = 'Ⅱ 暂停'; });
      media.addEventListener('pause', () => { document.getElementById('timelinePlayBtn').textContent = '▶ 播放'; });
      host.appendChild(media);
      reviewPlaybackMedia = media;
      updateTimelinePlayhead();
    }

    function toggleTimelinePlayback() {
      if (reviewPlaybackMedia) {
        if (reviewPlaybackMedia.paused) reviewPlaybackMedia.play().catch(() => showToast('媒体无法播放', 'error'));
        else reviewPlaybackMedia.pause();
        return;
      }
      if (reviewPlaybackTimer) {
        cancelAnimationFrame(reviewPlaybackTimer);
        reviewPlaybackTimer = null;
        document.getElementById('timelinePlayBtn').textContent = '▶ 播放';
        return;
      }
      const startedAt = performance.now();
      const origin = reviewSession.playhead;
      const tick = now => {
        const elapsed = (now - startedAt) / 1000;
        reviewSession.playhead = origin + elapsed;
        if (reviewSession.playhead >= timelineDuration()) {
          reviewSession.playhead = timelineDuration();
          reviewPlaybackTimer = null;
          document.getElementById('timelinePlayBtn').textContent = '▶ 播放';
        } else reviewPlaybackTimer = requestAnimationFrame(tick);
        updateTimelinePlayhead();
      };
      document.getElementById('timelinePlayBtn').textContent = 'Ⅱ 暂停';
      reviewPlaybackTimer = requestAnimationFrame(tick);
    }

    function renderTimeline() {
      const scroll = document.getElementById('timelineScroll');
      if (!scroll || !reviewWorkspace) return;
      const previousScrollLeft = scroll.scrollLeft;
      const duration = timelineDuration();
      const scale = 60;
      const trackWidth = Math.max(900, Math.ceil(duration * scale) + 32);
      const lanes = [
        ['playback', 'Playback'],
        ['annotation', 'Annotation'],
        ['context', 'Context']
      ];
      const ticks = [];
      for (let second = 0; second <= Math.ceil(duration); second += 1) {
        ticks.push(`<span class="timeline-tick" style="left:${second * scale}px">${formatReviewTime(second)}</span>`);
      }
      const rows = lanes.map(([lane, label]) => {
        const placements = reviewSession.placements.filter(item => item.lane === lane).map(item => {
          const stale = isStalePlacement(item);
          const width = Math.max(18, ((item.end ?? item.start + .25) - item.start) * scale);
          const selected = reviewSession.selection && reviewSession.selection.assetId === item.assetId && reviewSession.selection.targetId === item.targetId;
          return `<button class="timeline-placement ${lane}${selected ? ' selected' : ''}${stale ? ' stale' : ''}" data-placement-id="${escapeHtml(item.id)}" style="left:${item.start * scale + 4}px;width:${width}px" title="${escapeHtml(item.label)}">${escapeHtml(item.label)}${stale ? ' · stale' : ''}</button>`;
        }).join('');
        return `<div class="timeline-lane-row" style="grid-template-columns:130px ${trackWidth}px"><div class="timeline-label">${label}</div><div class="timeline-track" data-timeline-track="${lane}" style="background-size:${scale}px 100%">${placements}</div></div>`;
      }).join('');
      scroll.innerHTML = `<div class="timeline-content" style="width:${trackWidth + 130}px">
        <div class="timeline-ruler" style="grid-template-columns:130px ${trackWidth}px"><div class="timeline-label">时间</div><div class="timeline-ruler-track">${ticks.join('')}</div></div>
        ${rows}
        <div class="timeline-playhead" id="timelinePlayhead"></div>
      </div>`;
      scroll.scrollLeft = previousScrollLeft;
      scroll.querySelectorAll('[data-timeline-track]').forEach(track => track.addEventListener('click', event => {
        if (event.target.closest('.timeline-placement')) return;
        const rect = track.getBoundingClientRect();
        setReviewPlayhead(Math.max(0, (event.clientX - rect.left) / scale));
      }));
      scroll.querySelectorAll('[data-placement-id]').forEach(item => item.addEventListener('click', event => {
        event.stopPropagation();
        const placement = reviewSession.placements.find(candidate => candidate.id === item.dataset.placementId);
        if (!placement) return;
        reviewSession.selection = { kind: placement.targetKind, assetId: placement.assetId, targetId: placement.targetId };
        setReviewPlayhead(placement.start);
        selectReviewAsset(placement.assetId, true);
        if (placement.targetKind === 'artifact') setPrimaryPlayback(placement.assetId, placement.targetId);
      }));
      updateTimelinePlayhead();
    }

    function timelineDuration() {
      let max = 30;
      reviewSession.placements.forEach(item => { max = Math.max(max, item.end ?? item.start + 1); });
      const primary = reviewSession.primaryPlayback;
      const artifact = primary && reviewFocusCache[primary.assetId]?.artifacts.find(item => item.artifactId === primary.artifactId);
      if (artifact?.preview.duration) max = Math.max(max, artifact.preview.duration);
      return Math.ceil(max * 1000) / 1000;
    }

    function setReviewPlayhead(value) {
      reviewSession.playhead = Math.max(0, Math.min(value, timelineDuration()));
      const primary = reviewSession.primaryPlayback;
      const placement = primary && reviewSession.placements.find(item => item.targetKind === 'artifact' && item.targetId === primary.artifactId);
      if (reviewPlaybackMedia) reviewPlaybackMedia.currentTime = Math.max(0, reviewSession.playhead - (placement?.start || 0));
      saveReviewSession();
      updateTimelinePlayhead();
    }

    function updateTimelinePlayhead() {
      const line = document.getElementById('timelinePlayhead');
      if (line) line.style.left = `${130 + reviewSession.playhead * 60}px`;
      const label = document.getElementById('reviewTimeLabel');
      if (label) label.textContent = formatReviewTime(reviewSession.playhead, true);
    }

    function isStalePlacement(placement) {
      if (!reviewWorkspace?.assets.some(asset => asset.assetId === placement.assetId)) return true;
      if (placement.targetKind !== 'artifact') return false;
      const focus = reviewFocusCache[placement.assetId];
      if (!focus) return false;
      const artifact = focus.artifacts.find(item => item.artifactId === placement.targetId);
      return !artifact || artifact.revisionId !== placement.revisionId;
    }

    function renderCanvas() {
      const nodesEl = document.getElementById('canvasNodes');
      const edgesEl = document.getElementById('canvasEdges');
      const world = document.getElementById('canvasWorld');
      if (!nodesEl || !edgesEl || !world || !reviewWorkspace) return;
      const nodes = reviewWorkspace.graph.nodes || [];
      const positions = reviewSession.canvas.nodePositions;
      nodes.forEach((node, index) => {
        if (!positions[node.id]) positions[node.id] = { x: 80 + (index % 4) * 250, y: 90 + Math.floor(index / 4) * 150 };
      });
      world.style.transform = `translate(${reviewSession.canvas.panX}px, ${reviewSession.canvas.panY}px) scale(${reviewSession.canvas.scale})`;
      nodesEl.innerHTML = nodes.map(node => {
        const asset = reviewWorkspace.assets.find(item => item.assetId === node.id);
        const selected = reviewSession.selection?.assetId === node.id;
        const flags = [asset?.lifecycleState, asset?.hasArtifacts ? 'artifact' : '', asset?.hasCanonicalTimeline ? 'timeline' : ''].filter(Boolean).map(flag => `<span class="canvas-node-flag">${escapeHtml(flag)}</span>`).join('');
        const point = positions[node.id];
        return `<div class="canvas-node${selected ? ' selected' : ''}" data-canvas-node="${escapeHtml(node.id)}" style="left:${point.x}px;top:${point.y}px"><div class="canvas-node-title">${escapeHtml(node.label)}</div><div class="canvas-node-meta">${escapeHtml(asset?.category || 'asset')}</div><div class="canvas-node-flags">${flags}</div></div>`;
      }).join('');
      edgesEl.querySelectorAll('.canvas-edge').forEach(edge => edge.remove());
      (reviewWorkspace.graph.edges || []).forEach(edge => {
        const source = positions[edge.source];
        const target = positions[edge.target];
        if (!source || !target) return;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('class', 'canvas-edge');
        line.setAttribute('x1', String(source.x + 83)); line.setAttribute('y1', String(source.y + 35));
        line.setAttribute('x2', String(target.x + 83)); line.setAttribute('y2', String(target.y + 35));
        line.setAttribute('data-edge-id', edge.id);
        edgesEl.appendChild(line);
      });
      nodesEl.querySelectorAll('[data-canvas-node]').forEach(node => {
        node.addEventListener('click', () => selectReviewAsset(node.dataset.canvasNode));
        node.addEventListener('pointerdown', startCanvasNodeDrag);
      });
      saveReviewSession();
      bindCanvasInteractions();
    }

    function fitCanvas() {
      reviewSession.canvas.panX = 40;
      reviewSession.canvas.panY = 40;
      reviewSession.canvas.scale = 0.9;
      saveReviewSession();
      renderCanvas();
    }

    function bindCanvasInteractions() {
      if (canvasInteractionsBound) return;
      const viewport = document.getElementById('canvasViewport');
      if (!viewport) return;
      canvasInteractionsBound = true;
      viewport.addEventListener('pointerdown', event => {
        if (event.target.closest('.canvas-node')) return;
        canvasDrag = { x: event.clientX, y: event.clientY, panX: reviewSession.canvas.panX, panY: reviewSession.canvas.panY };
        viewport.classList.add('dragging');
        viewport.setPointerCapture(event.pointerId);
      });
      viewport.addEventListener('pointermove', event => {
        if (canvasDrag) {
          reviewSession.canvas.panX = canvasDrag.panX + event.clientX - canvasDrag.x;
          reviewSession.canvas.panY = canvasDrag.panY + event.clientY - canvasDrag.y;
          renderCanvas();
        }
        if (canvasNodeDrag) {
          const point = reviewSession.canvas.nodePositions[canvasNodeDrag.id];
          point.x = canvasNodeDrag.x + (event.clientX - canvasNodeDrag.startX) / reviewSession.canvas.scale;
          point.y = canvasNodeDrag.y + (event.clientY - canvasNodeDrag.startY) / reviewSession.canvas.scale;
          renderCanvas();
        }
      });
      viewport.addEventListener('pointerup', event => {
        canvasDrag = null;
        canvasNodeDrag = null;
        viewport.classList.remove('dragging');
        if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
        saveReviewSession();
      });
      viewport.addEventListener('wheel', event => {
        event.preventDefault();
        const rect = viewport.getBoundingClientRect();
        const before = reviewSession.canvas.scale;
        const factor = event.deltaY < 0 ? 1.1 : .9;
        const after = Math.max(.25, Math.min(2.5, before * factor));
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        reviewSession.canvas.panX = x - (x - reviewSession.canvas.panX) * (after / before);
        reviewSession.canvas.panY = y - (y - reviewSession.canvas.panY) * (after / before);
        reviewSession.canvas.scale = after;
        renderCanvas();
        saveReviewSession();
      }, { passive: false });
    }

    function startCanvasNodeDrag(event) {
      event.stopPropagation();
      const id = event.currentTarget.dataset.canvasNode;
      const point = reviewSession.canvas.nodePositions[id];
      canvasNodeDrag = { id, startX: event.clientX, startY: event.clientY, x: point.x, y: point.y };
      event.currentTarget.setPointerCapture?.(event.pointerId);
    }

    function formatReviewTime(seconds, millis = false) {
      const safe = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(safe / 60).toString().padStart(2, '0');
      const remaining = Math.floor(safe % 60).toString().padStart(2, '0');
      if (!millis) return `${minutes}:${remaining}`;
      return `${minutes}:${remaining}.${Math.floor((safe % 1) * 1000).toString().padStart(3, '0')}`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    }

    document.addEventListener('keydown', event => {
      if (reviewMode === 'timeline' && event.code === 'Space' && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
        event.preventDefault();
        toggleTimelinePlayback();
      }
    });

    // ================================================================
    // Split View
    // ================================================================
    function toggleSplitView() {
      splitMode = !splitMode;
      const btn = document.getElementById('splitBtn');
      const container = document.getElementById('splitContainer');
      const contentView = document.getElementById('contentView');

      btn.classList.toggle('active', splitMode);

      if (splitMode) {
        contentView.style.display = 'none';
        container.classList.add('active');
        // Load current doc into pane 1 if empty
        if (!splitPanes[1] && filteredDocs[curDocIdx]) {
          openInSplitPane(1, filteredDocs[curDocIdx].docId);
        }
      } else {
        container.classList.remove('active');
        contentView.style.display = 'flex';
      }
    }

    async function openInSplitPane(paneNum, docId) {
      if (!splitMode) return;
      const paneBody = document.getElementById(`sp${paneNum}Body`);
      const paneTitle = document.getElementById(`sp${paneNum}Title`);

      splitPanes[paneNum] = docId;

      // Fetch doc content
      let doc = allDocs.find(d => d.docId === docId);
      if (!doc) {
        paneBody.innerHTML = `<div class="split-pane-empty"><span>❌</span><div class="hint">文档 "${docId}" 未找到</div></div>`;
        return;
      }

      // Load content if not cached
      if (!docContents[docId]) {
        try {
          const r = await fetch(`${API}/api/documents/by-id/${docId}`);
          if (r.ok) {
            const d = await r.json();
            docContents[docId] = { content: d.content || '' };
          }
        } catch (_) {}
      }

      const raw = docContents[docId]?.content || '';
      const fm = parseFM(raw);
      const body = stripFM(raw);
      const cat = (fm && fm.category) || doc.category || 'unknown';
      const status = (fm && fm.status) || doc.status || 'drafting';
      const title = (fm && fm.title) || doc.title || docId;

      paneTitle.textContent = title;

      // Build content
      let html = `<div class="dp-tags" style="margin-bottom:10px;">
        <span class="t ${cat}">${cat}</span>
        <span class="t ${status}">${status}</span>
      </div>`;

      // Prompt with clickable @id refs
      const prompt = (fm && fm.prompt) ? fm.prompt : '';
      if (prompt) {
        const clickablePrompt = prompt.replace(
          /@([a-zA-Z0-9_\-]+)(?::([a-zA-Z0-9_\-]+))?/g,
          (match, id, variant) => {
            const label = variant ? `@${id}:${variant}` : `@${id}`;
            return `<a class="split-ref-link" onclick="openRefInOtherPane('${id}', ${paneNum})" title="点击打开 @${id}">${label}</a>`;
          }
        );
        html += `<div style="background:var(--accent-bg);border-radius:6px;padding:10px;margin-bottom:10px;">
          <div style="font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">Prompt</div>
          <div style="font-size:13px;color:var(--text);line-height:1.6;">${clickablePrompt}</div>
        </div>`;
      }

      // Markdown body
      let cleanBody = body;
      if (cleanBody) {
        cleanBody = cleanBody.split(/\n(?=## )/).filter(s => {
          const fl = s.trim().split('\n')[0];
          return !fl.match(/^##\s*(Design|Approved)\s*References$/i);
        }).join('\n');
      }
      if (cleanBody) {
        try {
          const mdHtml = fixMdImages(renderMd(cleanBody), doc.docPath);
          html += `<div class="md">${mdHtml}</div>`;
        } catch(_) {}
      }

      paneBody.innerHTML = html;
    }

    function openRefInOtherPane(refId, sourcePane) {
      if (!splitMode) return;
      const targetPane = sourcePane === 1 ? 2 : 1;
      openInSplitPane(targetPane, refId);
    }

    function openRefAsCompare(refId) {
      // If not in split mode, enable split and open the ref in pane 2
      if (!splitMode) {
        splitMode = true;
        const btn = document.getElementById('splitBtn');
        const container = document.getElementById('splitContainer');
        const contentView = document.getElementById('contentView');
        btn.classList.add('active');
        contentView.style.display = 'none';
        container.classList.add('active');
        // Load current doc into pane 1
        if (filteredDocs[curDocIdx]) {
          openInSplitPane(1, filteredDocs[curDocIdx].docId);
        }
      }
      openInSplitPane(2, refId);
    }

    function closeSplitPane(paneNum) {
      const paneBody = document.getElementById(`sp${paneNum}Body`);
      const paneTitle = document.getElementById(`sp${paneNum}Title`);
      splitPanes[paneNum] = null;
      paneTitle.textContent = paneNum === 1 ? '文档 A' : '文档 B';
      paneBody.innerHTML = `<div class="split-pane-empty">
        <span>📄</span>
        <div class="hint">${paneNum === 1 ? '点击文档列表中的<br>文档名打开到此面板' : '点击 @id 引用链接<br>可在此打开依赖文档'}</div>
      </div>`;
    }

    // Modify sidebar doc click to support split view
    function onDocClick(idx, event) {
      if (splitMode && event && event.shiftKey) {
        // Shift+click opens in the first empty pane
        const doc = filteredDocs[idx];
        if (!doc) return;
        if (!splitPanes[1]) openInSplitPane(1, doc.docId);
        else if (!splitPanes[2]) openInSplitPane(2, doc.docId);
        return;
      }
      pickDoc(idx);
    }

    // ================================================================
    // Theme
    // ================================================================
    function toggleTheme() {
      const html = document.documentElement;
      const dark = html.getAttribute('data-theme') !== 'light';
      html.setAttribute('data-theme', dark ? 'light' : 'dark');
      document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
      localStorage.setItem('opsv-theme', dark ? 'light' : 'dark');
    }
    (() => {
      const s = localStorage.getItem('opsv-theme');
      if (s) {
        document.documentElement.setAttribute('data-theme', s);
        document.getElementById('themeBtn').textContent = s === 'light' ? '☀️' : '🌙';
      }
    })();

    // ================================================================
    // Sidebar
    // ================================================================
    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebarOverlay');
      const open = sb.classList.toggle('open');
      ov.classList.toggle('open', open);
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');
    }

    // ================================================================
    // Init
    // ================================================================
    async function init() {
      try {
        const res = await fetch(`${API}/api/documents`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allDocs = await res.json();
        await loadReviewWorkspace();

        try {
          const s = localStorage.getItem('opsv-review-state');
          if (s) reviewState = JSON.parse(s);
        } catch (_) {}

        if (allDocs.length === 0) {
          document.getElementById('loadingView').style.display = 'none';
          document.getElementById('emptyView').style.display = 'flex';
          return;
        }

        // Project name
        if (allDocs[0].docPath) {
          const p = allDocs[0].docPath.split('/');
          let vi = p.indexOf('videospec');
          if (vi === -1) vi = p.indexOf('opsv-queue');
          if (vi >= 1) {
            const name = p[vi - 1];
            document.getElementById('topTitle').textContent = name;
            document.getElementById('sidebarTitle').textContent = name;
          }
        }

        // Categories
        const cats = [...new Set(allDocs.map(d => d.category || 'unknown').filter(Boolean))].sort();
        const cl = document.getElementById('catList');
        cl.innerHTML = `<div class="cat-item active" data-cat="" onclick="pickCat('')">全部<span class="cat-count">${allDocs.length}</span></div>` +
          cats.map(c => {
            const n = allDocs.filter(d => (d.category||'unknown') === c).length;
            return `<div class="cat-item" data-cat="${c}" onclick="pickCat('${c}')">${c}<span class="cat-count">${n}</span></div>`;
          }).join('');

        // Restore navigation position
        const savedCat = localStorage.getItem('opsv-nav-cat');
        const savedIdx = parseInt(localStorage.getItem('opsv-nav-idx') || '0', 10);
        currentCat = (savedCat && cats.includes(savedCat)) ? savedCat : '';
        if (currentCat) {
          document.querySelector('#catList .cat-item.active')?.classList.remove('active');
          document.querySelector(`#catList .cat-item[data-cat="${currentCat}"]`)?.classList.add('active');
        }

        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('contentView').style.display = 'flex';

        applyFilter(currentCat, savedIdx);
      } catch (e) {
        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('errorView').style.display = 'flex';
        document.getElementById('errorMsg').textContent = e.message;
      }
    }

    // ================================================================
    // Category / Filter
    // ================================================================
    function pickCat(cat) {
      document.querySelectorAll('#catList .cat-item').forEach(el => {
        el.classList.toggle('active', el.dataset.cat === cat);
      });
      currentCat = cat;
      localStorage.setItem('opsv-nav-cat', cat);
      applyFilter(cat);
    }
